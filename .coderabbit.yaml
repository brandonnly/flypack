# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  # Generated by brand/scripts/build.mjs; review the script, not its output.
  path_filters:
    - "!brand/logo/**"
    - "!brand/app-icon/**"
    - "!brand/favicon/**"
    - "!brand/social/**"
    - "!brand/explorations/**"
    - "!brand/preview.png"

knowledge_base:
  code_guidelines:
    filePatterns:
      - files: "AGENTS.md"
        applyTo: "**"
      - files: "brand/tokens/README.md"
        applyTo: "brand/tokens/**"
