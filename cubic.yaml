# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json

version: 1

reviews:
  custom_instructions: >-
    This repository is public. Apply the "Public repository" rules in AGENTS.md and flag any
    secret, credential, personal data or machine-specific detail in code, fixtures, logs or docs.
    Check new dependencies and copied code against docs/adr/0001-agpl-license.md. For UI, apply
    brand/tokens/README.md. Cite the rule for each finding.
  ignore:
    files:
      - "brand/logo/**"
      - "brand/app-icon/**"
      - "brand/favicon/**"
      - "brand/social/**"
      - "brand/explorations/**"
      - "brand/preview.png"
